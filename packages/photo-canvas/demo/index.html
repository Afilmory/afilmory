<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>photo-canvas demo</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1c1c1e; color: #fff; font: 12px ui-monospace, monospace; overflow: hidden; }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; outline: none; }
      #hud { position: fixed; left: 12px; top: 12px; padding: 6px 10px; background: rgba(0, 0, 0, 0.6); border-radius: 8px; white-space: pre; pointer-events: none; }
      #bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 4px; }
      button { font: inherit; color: #fff; background: rgba(60, 60, 64, 0.8); border: 0; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
    </style>
  </head>
  <body>
    <canvas id="canvas" tabindex="0"></canvas>
    <div id="hud"></div>
    <div id="bar"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
